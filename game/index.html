<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunfall Shores</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1628; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud-canvas { position: fixed; top: 0; left: 0; pointer-events: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunfall Shores: open world coastal city"></canvas>
<canvas id="hud-canvas"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
